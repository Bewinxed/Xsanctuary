name: Build and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release (e.g., 1.0.0)'
        required: true
        type: string
      publish:
        description: 'Also submit the uploaded draft for review'
        required: false
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Get version
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "version=${{ inputs.version }}" >> $GITHUB_OUTPUT
          else
            echo "version=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT
          fi

      - name: Update version in package.json
        run: |
          bun --eval "
            const pkg = require('./package.json');
            pkg.version = '${{ steps.version.outputs.version }}';
            require('fs').writeFileSync('./package.json', JSON.stringify(pkg, null, 2));
          "

      - name: Build Chrome extension
        run: bun run zip

      - name: Build Firefox extension
        run: bun run zip:firefox

      - name: Rename artifacts
        run: |
          mv .output/xsanctuary-${{ steps.version.outputs.version }}-chrome.zip ./xsanctuary-${{ steps.version.outputs.version }}-chrome.zip 2>/dev/null || mv .output/*.zip ./xsanctuary-${{ steps.version.outputs.version }}-chrome.zip
          mv .output/xsanctuary-${{ steps.version.outputs.version }}-firefox.zip ./xsanctuary-${{ steps.version.outputs.version }}-firefox.zip 2>/dev/null || true

      - name: List output files
        run: ls -la .output/ && ls -la *.zip

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          name: XSanctuary v${{ steps.version.outputs.version }}
          tag_name: v${{ steps.version.outputs.version }}
          generate_release_notes: true
          files: |
            xsanctuary-*-chrome.zip
            xsanctuary-*-firefox.zip
          body: |
            ## Installation

            ### Chrome / Edge / Brave
            1. Download `xsanctuary-${{ steps.version.outputs.version }}-chrome.zip`
            2. Extract the zip file
            3. Go to `chrome://extensions`
            4. Enable "Developer mode"
            5. Click "Load unpacked" and select the extracted folder

            ### Firefox
            1. Download `xsanctuary-${{ steps.version.outputs.version }}-firefox.zip`
            2. Go to `about:debugging#/runtime/this-firefox`
            3. Click "Load Temporary Add-on"
            4. Select the zip file

            ---

            For permanent Firefox installation, the extension needs to be signed by Mozilla or installed in Firefox Developer Edition with `xpinstall.signatures.required` set to `false`.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Uploads to the Chrome Web Store listing.
  #
  # This item is opted in to Verified CRX Uploads, so the package must be a
  # CRX3 signed with our own RSA key. The store verifies that signature, then
  # repackages with its own key, which is why the extension ID stays the same.
  # A plain ZIP upload would be rejected.
  #
  # Required repo secrets:
  #   CHROME_CLIENT_ID, CHROME_CLIENT_SECRET, CHROME_REFRESH_TOKEN
  #   CWS_SIGNING_KEY  (the private key PEM, whole file)
  #
  # Without them the job skips rather than fails, so tagging still produces the
  # GitHub release artifacts.
  publish-chrome:
    needs: build
    runs-on: ubuntu-latest

    env:
      PUBLISHER_ID: 14d964a6-b900-438b-a471-33cf1af9258a
      EXTENSION_ID: cfkdbndljmndgmnagcekhfjplieaagbk

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Check for credentials
        id: creds
        env:
          CLIENT_ID: ${{ secrets.CHROME_CLIENT_ID }}
          SIGNING_KEY: ${{ secrets.CWS_SIGNING_KEY }}
        run: |
          if [ -n "$CLIENT_ID" ] && [ -n "$SIGNING_KEY" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Store credentials or signing key missing, skipping upload"
          fi

      - name: Get version
        if: steps.creds.outputs.present == 'true'
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION="${{ inputs.version }}"
          else
            VERSION="${GITHUB_REF#refs/tags/v}"
          fi

          # The store rejects any upload that isn't strictly newer than what's
          # live. Catching that here costs a second; finding out from an opaque
          # curl exit code costs a release cycle.
          PUBLISHED="3.0.1"
          HIGHEST=$(printf '%s\n%s\n' "$VERSION" "$PUBLISHED" | sort -V | tail -1)

          if [ "$VERSION" = "$PUBLISHED" ] || [ "$HIGHEST" != "$VERSION" ]; then
            echo "::error::Tag version $VERSION is not newer than the published $PUBLISHED, so the store would reject it. Tag a higher version."
            exit 1
          fi

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Set version in package.json
        if: steps.creds.outputs.present == 'true'
        run: |
          bun --eval "
            const pkg = require('./package.json');
            pkg.version = '${{ steps.version.outputs.version }}';
            require('fs').writeFileSync('./package.json', JSON.stringify(pkg, null, 2));
          "

      - name: Build
        if: steps.creds.outputs.present == 'true'
        run: bun run build

      - name: Sign package as CRX3
        if: steps.creds.outputs.present == 'true'
        env:
          SIGNING_KEY: ${{ secrets.CWS_SIGNING_KEY }}
        run: |
          # Keep the key off the workspace and out of any uploaded artifact
          KEY_PATH="$(mktemp)"
          chmod 600 "$KEY_PATH"
          printf '%s' "$SIGNING_KEY" > "$KEY_PATH"
          trap 'shred -u "$KEY_PATH" 2>/dev/null || rm -f "$KEY_PATH"' EXIT

          bunx crx3 -p "$KEY_PATH" -o .output/xsanctuary.crx -- .output/chrome-mv3

          # Fail loudly rather than uploading something malformed
          head -c 4 .output/xsanctuary.crx | grep -q 'Cr24' || {
            echo "::error::Signed package is not a valid CRX"; exit 1;
          }

      - name: Upload to Chrome Web Store
        if: steps.creds.outputs.present == 'true'
        env:
          CLIENT_ID: ${{ secrets.CHROME_CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.CHROME_CLIENT_SECRET }}
          REFRESH_TOKEN: ${{ secrets.CHROME_REFRESH_TOKEN }}
        run: |
          set -euo pipefail

          TOKEN=$(curl -s "https://oauth2.googleapis.com/token" \
            -d "client_id=$CLIENT_ID" \
            -d "client_secret=$CLIENT_SECRET" \
            -d "refresh_token=$REFRESH_TOKEN" \
            -d "grant_type=refresh_token" | jq -r '.access_token')

          if [ -z "$TOKEN" ] || [ "$TOKEN" = "null" ]; then
            echo "::error::Could not exchange the refresh token for an access token"
            exit 1
          fi

          echo "Uploading version ${{ steps.version.outputs.version }}"

          # Capture the body and status separately. --fail-with-body under
          # `set -e` aborts before anything can be printed, which hides the one
          # thing worth seeing when the store says no.
          HTTP_CODE=$(curl -s -o /tmp/cws-response.json -w '%{http_code}' -X POST \
            -H "Authorization: Bearer $TOKEN" \
            -H "X-Goog-Upload-Protocol: raw" \
            -H "X-Goog-Upload-File-Name: xsanctuary.crx" \
            -T .output/xsanctuary.crx \
            "https://chromewebstore.googleapis.com/upload/v2/publishers/$PUBLISHER_ID/items/$EXTENSION_ID:upload" || true)

          echo "HTTP $HTTP_CODE"
          cat /tmp/cws-response.json || true
          echo

          if [ "$HTTP_CODE" != "200" ]; then
            echo "::error::Store rejected the upload with HTTP $HTTP_CODE: $(jq -r '.error.message // .' /tmp/cws-response.json 2>/dev/null || cat /tmp/cws-response.json)"
            exit 1
          fi

          if jq -e '.uploadState == "FAILURE"' /tmp/cws-response.json > /dev/null 2>&1; then
            echo "::error::Upload failed: $(jq -r '[.itemError[]?.error_detail] | join("; ")' /tmp/cws-response.json)"
            exit 1
          fi

          echo "Uploaded. The new version is a draft in the dashboard."

      # Left as a separate, manually triggered step on purpose: the upload above
      # lands a draft in the dashboard, so the new version can be looked at
      # before it goes to users. Run the workflow with publish=true to ship it.
      - name: Submit for review
        if: steps.creds.outputs.present == 'true' && inputs.publish == true
        env:
          CLIENT_ID: ${{ secrets.CHROME_CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.CHROME_CLIENT_SECRET }}
          REFRESH_TOKEN: ${{ secrets.CHROME_REFRESH_TOKEN }}
        run: |
          set -euo pipefail

          TOKEN=$(curl -s "https://oauth2.googleapis.com/token" \
            -d "client_id=$CLIENT_ID" \
            -d "client_secret=$CLIENT_SECRET" \
            -d "refresh_token=$REFRESH_TOKEN" \
            -d "grant_type=refresh_token" | jq -r '.access_token')

          curl -s --fail-with-body -X POST \
            -H "Authorization: Bearer $TOKEN" \
            -H "Content-Length: 0" \
            "https://chromewebstore.googleapis.com/v2/publishers/$PUBLISHER_ID/items/$EXTENSION_ID:publish"

  # Optional: Upload to Firefox Add-ons (requires API credentials)
  # publish-firefox:
  #   needs: build
  #   runs-on: ubuntu-latest
  #   steps:
  #     - name: Download artifact
  #       uses: actions/download-artifact@v4
  #     - name: Publish to Firefox Add-ons
  #       uses: browser-actions/release-firefox-addon@latest
  #       with:
  #         addon-id: ${{ secrets.FIREFOX_ADDON_ID }}
  #         addon-path: xsanctuary-*-firefox.zip
  #         auth-api-issuer: ${{ secrets.FIREFOX_API_ISSUER }}
  #         auth-api-secret: ${{ secrets.FIREFOX_API_SECRET }}
